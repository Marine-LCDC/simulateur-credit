name: Validate simulator migration
on:
  push:
    branches: [codex/migration-titayla, codex/fix-sso-1102, codex/simulator-commercial-readiness]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:worker
      - run: npx wrangler deploy --dry-run --config wrangler.staging.jsonc
